name: Publish site and refresh publications

on:
  push:
  schedule:
    # Monday at 08:23 UTC; avoids the top-of-hour scheduling rush.
    - cron: '23 8 * * 1'
  workflow_dispatch:
    inputs:
      refresh:
        description: Fetch current Google Scholar data
        type: boolean
        default: true
      allow_removals:
        description: Allow paper removals after reviewing Scholar merges or deletions
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test publication handling
        run: python -m unittest discover -s tests -v
      - name: Install Scholar dependency for refresh runs
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: python -m pip install -r requirements-citations.txt
      - name: Build website
        env:
          REFRESH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh) }}
          ALLOW_REMOVALS: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_removals }}
        run: |
          args=(--previous-url https://zwadhams.github.io/publications.json)
          if [ "$REFRESH" = "true" ]; then args+=(--refresh); fi
          if [ "$ALLOW_REMOVALS" = "true" ]; then args+=(--allow-removals); fi
          python scripts/update_publications.py "${args[@]}"
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
